<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <!-- Hoa văn Phật giáo tông vàng chìm, lặp liền mạch làm nền: pháp luân, hoa sen, lá bồ đề -->
  <defs>
    <!-- Pháp luân tám nan (Bát chánh đạo) đặt trên vòng cánh sen; nan nhọn hình kim cang, không có núm tròn
         ở ngoài vành để khỏi giống bánh lái tàu -->
    <g id="spoke">
      <path d="M0 -6 L1.6 -14 L0 -23 L-1.6 -14 Z" fill="#c9943a" fill-opacity="0.5" />
      <path d="M0 -24 C4 -27 4 -32 0 -36 C-4 -32 -4 -27 0 -24 Z" transform="rotate(22.5)" />
    </g>
    <g id="wheel">
      <circle r="23" />
      <circle r="19.5" stroke-width="1.1" />
      <circle r="6" />
      <circle r="2" fill="#c9943a" stroke="none" />
      <use xlink:href="#spoke" />
      <use xlink:href="#spoke" transform="rotate(45)" />
      <use xlink:href="#spoke" transform="rotate(90)" />
      <use xlink:href="#spoke" transform="rotate(135)" />
      <use xlink:href="#spoke" transform="rotate(180)" />
      <use xlink:href="#spoke" transform="rotate(225)" />
      <use xlink:href="#spoke" transform="rotate(270)" />
      <use xlink:href="#spoke" transform="rotate(315)" />
    </g>
    <!-- Hoa sen nở trên mặt nước -->
    <g id="lotus">
      <path d="M0 14 C-12 4 -30 2 -40 8 C-30 18 -14 18 0 14 Z" />
      <path d="M0 14 C12 4 30 2 40 8 C30 18 14 18 0 14 Z" />
      <path d="M0 14 C-4 -2 -16 -14 -30 -14 C-28 2 -16 12 0 14 Z" />
      <path d="M0 14 C4 -2 16 -14 30 -14 C28 2 16 12 0 14 Z" />
      <path d="M0 -28 C11 -16 11 4 0 14 C-11 4 -11 -16 0 -28 Z" fill="#c9943a" fill-opacity="0.35" />
      <path d="M-28 22 Q0 30 28 22" />
      <path d="M-16 28 Q0 33 16 28" stroke-width="1.4" />
    </g>
    <!-- Lá bồ đề: gốc hình tim, đuôi nhọn dài -->
    <g id="bodhi">
      <path d="M0 40 C2 28 18 18 24 4 C30 -12 18 -26 0 -18 C-18 -26 -30 -12 -24 4 C-18 18 -2 28 0 40 Z" />
      <path d="M0 -22 L0 32" stroke-width="1.4" />
      <path d="M0 -6 L-14 -14 M0 -6 L14 -14 M0 8 L-15 -1 M0 8 L15 -1 M0 20 L-9 12 M0 20 L9 12" stroke-width="1.1" />
    </g>
  </defs>
  <g fill="none" stroke="#c9943a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.2">
    <use xlink:href="#wheel" transform="translate(60 60)" />
    <use xlink:href="#lotus" transform="translate(180 182)" />
    <use xlink:href="#bodhi" transform="translate(182 58) rotate(28) scale(0.85)" />
    <use xlink:href="#bodhi" transform="translate(58 182) rotate(-152) scale(0.85)" />
  </g>
</svg>
